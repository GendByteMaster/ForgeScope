name: Update v0.1.0 release notes

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/update-release-v0.1.0.yml

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Update GitHub Release v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          # ForgeScope v0.1.0

          First public release of ForgeScope.

          ForgeScope is a repository-wide engineering review and optimization Agent Skill with a portable CLI for Codex, Claude Code, and Cursor.

          ## Highlights

          - Understand → Inspect → Prioritize → Fix → Verify engineering workflow.
          - Architecture, correctness, security, performance, reliability, API, database, frontend, tests, dependencies, infrastructure, and documentation review guidance.
          - Persistent `.forgescope/REVIEW.md` workspace for resumable audits.
          - Safe bounded subagent delegation with primary-agent ownership.
          - Portable CLI with `install`, `status`, `uninstall`, and `init` commands.
          - Project-level and user-level installation for Codex, Claude Code, and Cursor.
          - Safe uninstall behavior that preserves `.forgescope/REVIEW.md`.
          - Node.js 18+ support with CI coverage on Node 18, 20, and 22.

          ## Quick start

          ForgeScope follows the same GitHub-first `npx` model as ForgeGuard. It can run directly from GitHub and does not require publication to the npm Registry.

          Install ForgeScope for Codex at user level:

          ```bash
          npx --yes github:GendByteMaster/ForgeScope install --client codex --global
          ```

          Check the installation:

          ```bash
          npx --yes github:GendByteMaster/ForgeScope status --client codex --global
          ```

          Initialize a persistent review workspace in the current repository:

          ```bash
          npx --yes github:GendByteMaster/ForgeScope init
          ```

          Upgrade or replace the installed Skill:

          ```bash
          npx --yes github:GendByteMaster/ForgeScope install --client codex --global --force
          ```

          Uninstall the Skill while preserving review history:

          ```bash
          npx --yes github:GendByteMaster/ForgeScope uninstall --client codex --global
          ```

          ## Pin this release

          For reproducible use of this exact release:

          ```bash
          npx --yes github:GendByteMaster/ForgeScope#v0.1.0 install --client codex --global
          ```

          ## Permanent CLI command

          To install the `forgescope` shell command directly from GitHub:

          ```bash
          npm install --global github:GendByteMaster/ForgeScope
          forgescope --version
          ```

          ## Review workspace

          `forgescope init` creates:

          ```text
          .forgescope/
          └── REVIEW.md
          ```

          The workspace keeps scope, baseline, findings, hypotheses, execution progress, decisions, verification results, remaining risks, and deferred work so substantial reviews can be resumed safely.

          Existing workspace content is preserved unless `init --force` is explicitly used.
          EOF

          gh release edit v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "ForgeScope v0.1.0" \
            --notes-file release-notes.md
